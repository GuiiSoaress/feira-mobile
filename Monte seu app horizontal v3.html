<title>Monte seu app</title>
<style>
:root{--lw:240px;--pw:330px;--ph:620px;--cw:480px;--bg:#f1f4f9;--card:#fff;--tx:#1d2433;--mu:#6b7585;--bd:#dde3ec;--ac:#2563eb;--code:#0f172a;--codetx:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#161d30;--tx:#e8ecf5;--mu:#93a0b8;--bd:#2a3350}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#161d30;--tx:#e8ecf5;--mu:#93a0b8;--bd:#2a3350}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap}

header b{color:var(--mu);font-size:15px}

.tp{background:var(--ac);color:#fff}

.pal{display:flex;flex-direction:column;gap:8px;overflow:auto}
.gt{font-size:13px;font-weight:700;color:var(--ac);margin:8px 0 0;text-transform:uppercase;letter-spacing:.05em}
.pi{display:flex;align-items:center;gap:10px;padding:11px 12px;border:2px solid var(--bd);border-radius:14px;font-size:18px;font-weight:600;background:var(--bg);touch-action:none;cursor:grab}
.pi span{font-size:26px}
.pi small{display:block;font-size:12px;color:var(--mu);font-weight:500}
.mid{align-items:center;overflow:auto}
.phone{width:var(--pw);height:var(--ph);flex:none;background:#111;border-radius:38px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#screen{height:100%;background:#fff;border-radius:28px;padding:46px 12px 28px;overflow:auto;display:flex;flex-direction:column;gap:10px;color:#222}

.hint{margin:auto;text-align:center;color:#8a93a3;font-size:18px;padding:20px}
.it{touch-action:none;border-radius:10px;padding:3px;border:2px solid transparent;cursor:grab;flex:none}
.it.sel{border-color:var(--ac)}
.v-t{font-size:24px;font-weight:700;margin-bottom:4px}
.v-in{border:1.5px solid #bbb;border-radius:8px;padding:9px;color:#999;font-size:15px;margin-top:6px}
.v-bt{color:#fff;text-align:center;padding:11px;border-radius:10px;font-weight:600;font-size:16px;margin-top:6px}
.v-cab{color:#fff;padding:12px;border-radius:10px;font-weight:700;font-size:18px}
.v-card{border:1.5px solid #e2e6ee;border-radius:12px;padding:8px}
.v-ph{height:80px;border-radius:8px;background:linear-gradient(135deg,#fcd34d,#fb923c);display:flex;align-items:center;justify-content:center;font-size:38px}
.v-gal{display:flex;gap:8px;overflow:hidden}

.v-map small{font-size:13px;color:#333}
.v-lk{font-size:30px;font-weight:600;padding:4px}
.v-tk{padding:9px 4px;border-bottom:1px solid #ddd;font-size:16px}
#edit{margin-top:10px;width:var(--pw);max-width:100%;display:none;gap:8px;flex-direction:column}
#edit.on{display:flex}

.sw{display:flex;gap:10px;align-items:center}

.code{padding:0}
.code h2{padding:14px 14px 0}
#code{flex:1;margin:0;padding:14px;background:var(--code);color:var(--codetx);border-radius:0 0 16px 16px;font:13px/1.45 ui-monospace,Consolas,Menlo,monospace;overflow:auto;white-space:pre;user-select:text;-webkit-user-select:text}
header label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
header input[type=range]{width:110px}
#tabs{display:flex;gap:10px;padding:10px 20px 0}

#tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#pres{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;padding:6px 20px 16px}
body.pv #pres{display:flex}
body.pv #hdr,body.pv #app{display:none}
#pres p{margin:0;color:var(--mu);font-size:16px}
#mm{flex:1;min-height:0;width:100%;max-width:1500px}
#mm g[data-b]{cursor:pointer}
#mm .kid{display:none}
#mm .kid.show{display:block}

#go{font-size:24px;font-weight:700;padding:16px 36px;border:0;border-radius:16px;background:#16a34a;color:#fff;cursor:pointer}

.pt span{font-size:34px}
.pt.on{color:#fff}
#pp{background:var(--card);border:1px solid var(--bd);border-top-width:12px;border-radius:20px;padding:28px 44px;display:flex;flex-direction:column;min-height:0;overflow:auto}

#pn{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
#pn button{font-size:24px;font-weight:700;padding:16px 32px;border:0;border-radius:14px;background:var(--bd);color:var(--tx);cursor:pointer}

#ah{display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*15) calc(var(--u)*5) calc(var(--u)*4);color:#fff;font-size:calc(var(--u)*6.5);font-weight:700}

#ghost{position:fixed;pointer-events:none;z-index:9;padding:12px 18px;background:var(--ac);color:#fff;border-radius:12px;font-weight:600;font-size:18px;display:none;opacity:.9}
.phone{position:relative}
.phone .isl{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:86px;height:23px;background:#000;border-radius:14px;z-index:3;pointer-events:none}

function pemoji(n){
  var t=String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  var m=[[/burger|hamburg|lanche|x-|cachorro|hot ?dog/,'🍔'],[/pizza/,'🍕'],[/suco|refri|bebida|agua|vitamina/,'🧃'],[/cafe|capuccino/,'☕'],[/sorvete|picole|acai/,'🍦'],[/bolo|doce|torta|brigadeiro/,'🍰'],[/tenis|sapato|chinelo|bota/,'👟'],[/camis|blusa|roupa/,'👕'],[/calca|short|bermuda/,'👖'],[/celular|telefone/,'📱'],[/fone/,'🎧'],[/livro/,'📚'],[/mochila|bolsa/,'🎒']];
  for(var i=0;i<m.length;i++)if(m[i][0].test(t))return m[i][1];
  return '🛍️';
}
function jt(s){return String(s).replace(/[{}<>]/g,function(c){return "{'"+c+"'}"})}
function ja(s){return String(s).replace(/"/g,'&quot;')}
function view(x){
  var p=parts(x.t);
  switch(x.type){
  case 'titulo':return '<div class="v-t" style="color:'+x.c+'">'+esc(x.t)+'</div>';
  case 'texto':return '<div style="font-size:16px;color:'+x.c+'">'+esc(x.t)+'</div>';
  case 'imagem':return '<div class="v-ph" style="height:120px">🏞️</div>';
  case 'campo':return '<div class="v-in">'+esc(x.t)+'</div>';
  case 'botao':return '<div class="v-bt" style="background:'+x.c+'">'+esc(x.t)+'</div>';
  case 'lista':return p.map(function(s){return '<div class="v-tk">'+esc(s)+'</div>'}).join('');
  case 'cabecalho':return '<div class="v-cab" style="background:'+x.c+'">☰ &nbsp;'+esc(x.t)+'</div>';
  case 'login':return '<div class="v-t">'+esc(x.t)+'</div><div class="v-in">E-mail</div><div class="v-in">Senha ••••</div><div class="v-bt" style="background:'+x.c+'">'+esc(x.t)+'</div>';
  case 'produto':return '<div class="v-card"><div class="v-ph">'+pemoji(p[0])+'</div><b>'+esc(p[0]||'')+'</b><div>'+esc(p[1]||'')+'</div><div class="v-bt" style="background:'+x.c+'">Comprar</div></div>';
  case 'curtir':return '<div class="v-lk" style="color:'+(x.on?x.c:'#aaa')+'">'+(x.on?'♥':'♡')+' '+esc(x.t)+'</div>';
  case 'whatsapp':return '<div class="v-bt" style="background:#25D366">📞 '+esc(x.t)+'</div>';
  case 'mapa':return '<div class="v-map">📍<small>'+esc(x.t)+'</small></div>';
  case 'galeria':return '<div class="v-gal"><div style="background:#fecaca">🌅</div><div style="background:#bfdbfe">🏖️</div><div style="background:#bbf7d0">🌳</div></div>';
  case 'tarefas':return p.map(function(s,i){var d=x.done&&x.done[i];return '<div class="v-tk" data-r="'+i+'">'+(d?'☑ ':'☐ ')+'<span style="'+(d?'text-decoration:line-through;color:#999':'')+'">'+esc(s)+'</span></div>'}).join('');
  }
}
function renderScreen(){
  screen.innerHTML=items.length?items.map(function(x){return '<div class="it'+(x.id===sel?' sel':'')+'" data-id="'+x.id+'">'+view(x)+'</div>'}).join(''):'<div class="hint">Arraste ou toque em um bloco da lista, ou escolha um app pronto</div>';
}
function jsx(x,n){
  var p=parts(x.t),tx=jt(x.t),ta=ja(x.t),p0=jt(p[0]||''),p1=jt(p[1]||'');
  switch(x.type){
  case 'titulo':return "      <Text style={[styles.titulo, { color: '"+x.c+"' }]}>"+tx+"</Text>";
  case 'texto':return "      <Text style={[styles.texto, { color: '"+x.c+"' }]}>"+tx+"</Text>";
  case 'imagem':return "      <Image\n        source={{ uri: 'https://exemplo.com/foto.png' }}\n        style={styles.imagem}\n      />";
  case 'campo':return '      <TextInput style={styles.campo} placeholder="'+ta+'" />';
  case 'botao':return "      <TouchableOpacity\n        style={[styles.botao, { backgroundColor: '"+x.c+"' }]}\n        onPress={() => alert('Olá!')}>\n        <Text style={styles.botaoTexto}>"+tx+"</Text>\n      </TouchableOpacity>";
  case 'lista':return "      <FlatList\n        data={["+p.map(function(s){return "'"+q(s)+"'"}).join(', ')+"]}\n        renderItem={({ item }) => <Text style={styles.item}>{item}</Text>}\n      />";
  case 'cabecalho':return "      <View style={[styles.cabecalho, { backgroundColor: '"+x.c+"' }]}>\n        <Text style={styles.cabTitulo}>☰  "+tx+"</Text>\n      </View>";
  case 'login':return "      <Text style={styles.titulo}>"+tx+"</Text>\n      <TextInput style={styles.campo} placeholder=\"E-mail\" />\n      <TextInput style={styles.campo} placeholder=\"Senha\" secureTextEntry />\n      <TouchableOpacity style={[styles.botao, { backgroundColor: '"+x.c+"' }]}>\n        <Text style={styles.botaoTexto}>"+tx+"</Text>\n      </TouchableOpacity>";
  case 'produto':return "      <View style={styles.cartao}>\n        <Image source={{ uri: 'https://exemplo.com/produto.png' }} style={styles.foto} />\n        <Text style={styles.nome}>"+p0+"</Text>\n        <Text>"+p1+"</Text>\n        <TouchableOpacity style={[styles.botao, { backgroundColor: '"+x.c+"' }]}>\n          <Text style={styles.botaoTexto}>Comprar</Text>\n        </TouchableOpacity>\n      </View>";
  case 'curtir':return "      <TouchableOpacity onPress={() => setCurtiu"+n+"(!curtiu"+n+")}>\n        <Text style={{ fontSize: 30, color: curtiu"+n+" ? '"+x.c+"' : '#aaa' }}>\n          ♥ "+tx+"\n        </Text>\n      </TouchableOpacity>";
  case 'whatsapp':return "      <TouchableOpacity\n        style={styles.whats}\n        onPress={() => Linking.openURL('https://wa.me/5516999999999')}>\n        <Text style={styles.botaoTexto}>"+tx+"</Text>\n      </TouchableOpacity>";
  case 'mapa':return "      <MapView\n        style={styles.mapa}\n        initialRegion={{ latitude: -22.0087, longitude: -47.8909,\n          latitudeDelta: 0.05, longitudeDelta: 0.05 }}>\n        <Marker coordinate={{ latitude: -22.0087, longitude: -47.8909 }}\n          title=\""+ta+"\" />\n      </MapView>";
  case 'galeria':return "      <ScrollView horizontal>\n        <Image source={{ uri: 'https://exemplo.com/1.png' }} style={styles.fotoGaleria} />\n        <Image source={{ uri: 'https://exemplo.com/2.png' }} style={styles.fotoGaleria} />\n        <Image source={{ uri: 'https://exemplo.com/3.png' }} style={styles.fotoGaleria} />\n      </ScrollView>";
  case 'tarefas':return "      <FlatList\n        data={["+p.map(function(s){return "'"+q(s)+"'"}).join(', ')+"]}\n        renderItem={({ item }) => (\n          <TouchableOpacity onPress={() => setFeitas"+n+"(prev => ({ ...prev, [item]: !prev[item] }))}>\n            <Text style={[styles.tarefa, feitas"+n+"[item] && styles.feita]}>\n              {feitas"+n+"[item] ? '☑' : '☐'} {item}\n            </Text>\n          </TouchableOpacity>\n        )}\n      />";
  }
}
function renderCode(){
  var imp={View:1},sty={},hooks=[],mapa=false,k=0,kt=0;
  items.forEach(function(x){
    IMP[x.type].forEach(function(i){imp[i]=1});
    TS[x.type].forEach(function(s){sty[s]=1});
    if(x.type==='mapa')mapa=true;
  });
  var body=items.map(function(x){
    var n='';
    if(x.type==='curtir'){k++;n=k>1?k:'';hooks.push("  const [curtiu"+n+", setCurtiu"+n+"] = useState(false);")}
    if(x.type==='tarefas'){kt++;n=kt>1?kt:'';hooks.push("  const [feitas"+n+", setFeitas"+n+"] = useState({});")}
    return jsx(x,n);
  }).join('\n');
  var out="import React"+(k||kt?", { useState }":"")+" from 'react';\nimport { "+Object.keys(imp).concat(['StyleSheet']).join(', ')+" } from 'react-native';\n"+(mapa?"import MapView, { Marker } from 'react-native-maps';\n":"")+"\nexport default function App() {\n"+(hooks.length?hooks.join('\n')+"\n\n":"")+"  return (\n    <View style={styles.container}>\n"+(body?body+'\n':'')+"    </View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  container: { flex: 1, padding: 16, gap: 12 },\n"+Object.keys(sty).map(function(s){return STY[s]}).join('\n')+"\n});\n";
  $('code').textContent=out;
}
function renderEdit(){
  var x=cur(),e=$('edit');
  if(!x){e.classList.remove('on');return}
  e.classList.add('on');
  var d=T[x.type];
  $('txt').style.display=d.txt?'block':'none';
  $('txt').value=x.t;
  $('sw').querySelectorAll('i').forEach(function(i){i.style.display=d.col?'block':'none'});
}
function all(){renderScreen();renderCode();renderEdit()}
function part(){renderScreen();renderCode()}
$('txt').addEventListener('input',function(){var x=cur();if(x){x.t=this.value;part()}});
$('sw').addEventListener('click',function(e){
  var c=e.target.dataset&&e.target.dataset.c;if(c&&cur()){cur().c=c;part()}
  if(e.target.id==='del'&&cur()){items=items.filter(function(i){return i.id!==sel});sel=null;all()}
});
$('clear').onclick=function(){items=[];sel=null;all()};
function add(k,at,t,c){
  var d=T[k],o={id:nid++,type:k,t:t!=null?t:d.t,c:c||d.c,on:false,done:{}};
  if(at==null)items.push(o);else items.splice(at,0,o);
  sel=o.id;
}
document.querySelectorAll('.tp').forEach(function(b){b.onclick=function(){
  items=[];sel=null;TP[b.dataset.tp].forEach(function(a){add(a[0],null,a[1],a[2])});sel=null;all();
}});

var drag=null;
document.addEventListener('pointerdown',function(e){
  var p=e.target.closest('.pi'),it=e.target.closest('.it');
  if(!p&&!it)return;
  drag={k:p?p.dataset.k:null,id:it?+it.dataset.id:null,x:e.clientX,y:e.clientY,moved:false};
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    drag.moved=true;
    var t=drag.k?T[drag.k]:T[cur2(drag.id).type];
    ghost.textContent=t.i+' '+t.n;ghost.style.display='block';
  }
  if(drag.moved){ghost.style.left=(e.clientX+12)+'px';ghost.style.top=(e.clientY+12)+'px';screen.classList.toggle('over',inScreen(e))}
});
function cur2(id){return items.find(function(i){return i.id===id})}
function inScreen(e){var r=screen.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
function idxAt(y){var n=0;screen.querySelectorAll('.it').forEach(function(el){var r=el.getBoundingClientRect();if(y>r.top+r.height/2)n++});return n}
document.addEventListener('pointerup',function(e){
  if(!drag)return;
  var d=drag;drag=null;ghost.style.display='none';screen.classList.remove('over');
  if(!d.moved){
    if(d.k)add(d.k);
    else{
      sel=d.id;var x=cur2(d.id),r=e.target.closest('[data-r]');
      if(x.type==='curtir')x.on=!x.on;
      if(x.type==='tarefas'&&r){x.done[r.dataset.r]=!x.done[r.dataset.r]}
    }
    all();return;
  }
  if(d.k){add(d.k,inScreen(e)?idxAt(e.clientY):null)}
  else{
    var i=items.findIndex(function(x){return x.id===d.id}),o=items[i];
    if(inScreen(e)){var at=idxAt(e.clientY);items.splice(i,1);if(at>i)at--;items.splice(at,0,o);sel=o.id}
    else{items.splice(i,1);sel=null}
  }
  all();
});
document.addEventListener('pointercancel',function(){drag=null;ghost.style.display='none';screen.classList.remove('over')});
document.querySelectorAll('input[data-v]').forEach(function(r){
  r.oninput=function(){document.documentElement.style.setProperty(r.dataset.v,r.value+'px')};
});

function fit(){
  var p=$('pres'),b=$('big'),h=p.clientHeight-24,w=p.clientWidth-40-(b.offsetWidth?b.offsetWidth+48:0);if(h<=0)return;
  var ph=Math.min(h,w*18.5/9,980),pw=ph*9/18.5,e=$('ph');
  e.style.height=ph+'px';e.style.width=pw+'px';e.style.setProperty('--u',(pw/100)+'px');
}
window.addEventListener('resize',fit);
function tab(t){
  document.body.classList.toggle('pv',t==='pres');if(t==='pres')requestAnimationFrame(fit);
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
}

var IDLE_MS=120000,idle=null;
function resetFeira(){items=[];sel=null;nid=1;all();closeApp();tab('pres')}
function bump(){clearTimeout(idle);idle=setTimeout(resetFeira,IDLE_MS)}
['pointerdown','pointermove','keydown','wheel','touchstart','input'].forEach(function(ev){document.addEventListener(ev,bump,{passive:true,capture:true})});
